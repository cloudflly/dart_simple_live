name: Build Windows dart_simple_live

on:
  push:
    branches: [ master ]
  workflow_dispatch: # 支持手动点击触发构建

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Zip Release output
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          directory: build/windows/x64/runner/Release
          filename: dart_simple_live_windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dart_simple_live-windows
          path: build/windows/x64/runner/Release/dart_simple_live_windows.zip
