name: Build Windows dart_simple_live

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'

      - name: Enter simple_live_app & Enable Windows desktop support
        run: |
          cd simple_live_app
          flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: |
          cd simple_live_app
          flutter pub get

      # 关键步骤：给 flutter_inappwebview 的 cmake 添加屏蔽宏
      - name: Patch inappwebview cmake to silence coroutine error
        run: |
          cd simple_live_app
          $cmakePath = (Get-ChildItem -Recurse -Filter "CMakeLists.txt" | Where-Object { $_.FullName -match "flutter_inappwebview" }).FullName
          if ($cmakePath) {
            Add-Content -Path $cmakePath -Value "add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
          }

      - name: Build Windows Release
        run: |
          cd simple_live_app
          flutter build windows --release

      - name: Compress release folder
        run: |
          cd simple_live_app
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/Release/dart_simple_live_windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dart_simple_live-windows
          path: simple_live_app/build/windows/x64/runner/Release/dart_simple_live_windows.zip
