name: Build Windows dart_simple_live

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build Windows Release
        working-directory: simple_live_app
        run: flutter build windows --release

      - name: Compress release folder
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "simple_live_app/build/windows/x64/runner/Release/*" `
            -DestinationPath "dart_simple_live_windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dart_simple_live-windows
          path: dart_simple_live_windows.zip
          if-no-files-found: error
