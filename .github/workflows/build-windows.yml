name: Build Windows dart_simple_live

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress release folder
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/Release/dart_simple_live_windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dart_simple_live-windows
          path: build/windows/x64/runner/Release/dart_simple_live_windows.zip
